  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAAZ ARMY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Poppins", sans-serif;
      background: #050507;
    }

    body {
      overflow-x: hidden;
    }

    .raaz-page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 15% 20%, rgba(226, 0, 27, 0.35), transparent 34%),
        radial-gradient(circle at 85% 75%, rgba(0, 99, 255, 0.30), transparent 36%),
        linear-gradient(135deg, #050507 0%, #10030a 45%, #020916 100%);
    }

    /* Animated background lights */
    .live-light {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.32;
      pointer-events: none;
      animation: moveLight 10s ease-in-out infinite alternate;
    }

    .live-light.red {
      top: -180px;
      left: -130px;
      background: #ff001e;
    }

    .live-light.blue {
      right: -160px;
      bottom: -180px;
      background: #006eff;
      animation-delay: -4s;
    }

    @keyframes moveLight {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(70px, 55px) scale(1.25);
      }
    }

    /* Moving background grid */
    .grid {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: 0.15;
      background-image:
        linear-gradient(rgba(255,255,255,0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.14) 1px, transparent 1px);
      background-size: 55px 55px;
      transform: perspective(500px) rotateX(55deg);
      animation: moveGrid 12s linear infinite;
      pointer-events: none;
    }

    @keyframes moveGrid {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 0 110px;
      }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 16px #ffffff;
      opacity: 0;
      animation: floatParticle 7s linear infinite;
    }

    .particle:nth-child(1) {
      left: 12%;
      bottom: -20px;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 30%;
      bottom: -20px;
      animation-delay: 2s;
    }

    .particle:nth-child(3) {
      left: 68%;
      bottom: -20px;
      animation-delay: 4s;
    }

    .particle:nth-child(4) {
      left: 88%;
      bottom: -20px;
      animation-delay: 1s;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) scale(0.4);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 720px;
      text-align: center;
      animation: contentEntry 0.9s ease-out both;
    }

    @keyframes contentEntry {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Raaz Army shield logo */
    .logo {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #f90027, #940015);
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 9px rgba(226, 0, 27, 0.16),
        0 0 45px rgba(255, 0, 38, 0.65);
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    .logo::after {
      content: "";
      position: absolute;
      inset: -13px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      animation: logoPulse 2s ease-out infinite;
    }

    @keyframes logoPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.18);
        opacity: 0;
      }
    }

    .logo svg {
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.45));
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
      padding: 8px 17px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .label-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff1238;
      box-shadow: 0 0 12px #ff1238;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.35;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 80px);
      line-height: 1.03;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
      text-shadow: 0 7px 30px rgba(0,0,0,0.55);
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, #ff163c, #ffffff 48%, #1681ff);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .description {
      max-width: 560px;
      margin: 19px auto 30px;
      color: rgba(255,255,255,0.76);
      font-size: 16px;
      line-height: 1.7;
      font-weight: 400;
    }

    .telegram-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-width: 250px;
      padding: 17px 29px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(90deg, #e80024, #bf001d);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.7px;
      box-shadow:
        0 12px 35px rgba(224, 0, 33, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.3);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .telegram-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      transform: skewX(-25deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.45),
        transparent
      );
      animation: buttonShine 3s ease-in-out infinite;
    }

    @keyframes buttonShine {
      0%, 35% {
        left: -120%;
      }
      70%, 100% {
        left: 150%;
      }
    }

    .telegram-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow:
        0 18px 45px rgba(224, 0, 33, 0.55),
        0 0 25px rgba(255,255,255,0.15);
    }

    .telegram-btn:active {
      transform: scale(0.97);
    }

    .telegram-btn svg {
      position: relative;
      z-index: 2;
      width: 22px;
      height: 22px;
    }

    .telegram-btn span {
      position: relative;
      z-index: 2;
    }

    .brand {
      margin-top: 55px;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand strong {
      color: #ffffff;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .raaz-page {
        min-height: 100svh;
        padding: 28px 16px;
      }

      .logo {
        width: 112px;
        height: 112px;
        margin-bottom: 23px;
      }

      .logo svg {
        width: 72px;
        height: 72px;
      }

      .label {
        margin-bottom: 15px;
        padding: 7px 13px;
        font-size: 10px;
        letter-spacing: 1.1px;
      }

      h1 {
        font-size: clamp(38px, 13vw, 58px);
        line-height: 1.02;
        letter-spacing: -2px;
      }

      .description {
        margin: 16px auto 25px;
        font-size: 14px;
        line-height: 1.65;
      }

      .telegram-btn {
        width: 100%;
        max-width: 320px;
        min-width: 0;
        padding: 16px 22px;
        font-size: 13px;
      }

      .brand {
        margin-top: 43px;
      }

      .grid {
        background-size: 42px 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

      <a

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

      <div class="brand">

    </div>
  </main>
</body>
